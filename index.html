<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueryFlow</title>
  <meta name="description" content="A fast, private SQL editor for BigQuery, PostgreSQL and MySQL that runs in your browser: formatting, lint, join graph, step-by-step view and editable variables." />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <!-- Link previews (Slack, WhatsApp, LinkedIn, X, iMessage…). Crawlers need absolute URLs and a
       PNG; the image is made from scripts/og-card.html. Update these if the site moves. -->
  <link rel="canonical" href="https://abhijeetcodes.github.io/QueryFlow/" />
  <meta name="theme-color" content="#3a63d8" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="QueryFlow" />
  <meta property="og:url" content="https://abhijeetcodes.github.io/QueryFlow/" />
  <meta property="og:title" content="QueryFlow: a SQL editor for BigQuery, PostgreSQL and MySQL" />
  <meta property="og:description" content="Read and edit big SQL queries in your browser: formatting, lint, a join graph, a step-by-step view and every filter value in one place. Free, no login, nothing uploaded." />
  <meta property="og:image" content="https://abhijeetcodes.github.io/QueryFlow/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="QueryFlow: a SQL query in the editor with its join graph below" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="QueryFlow: a SQL editor for BigQuery, PostgreSQL and MySQL" />
  <meta name="twitter:description" content="Read and edit big SQL queries in your browser: formatting, lint, a join graph and every filter value in one place. Free, no login, nothing uploaded." />
  <meta name="twitter:image" content="https://abhijeetcodes.github.io/QueryFlow/og.png" />
  <script>
    // Set the theme before first paint. Keep in step with resolveTheme() in main.js.
    (function () {
      let p = null;
      try { p = localStorage.getItem('queryflow.theme'); } catch {}
      if (!['paper', 'linen', 'midnight', 'graphite'].includes(p)) p = matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'paper';
      document.documentElement.dataset.theme = p;
    })();
  </script>
</head>
<body>
  <main class="layout">
    <section class="left">
      <div class="editor-bar actions">
        <span class="brand"><svg class="logo" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><rect class="logo-tile" width="32" height="32" rx="8"/><path class="logo-q" d="M22.5 14.5A8 8 0 1 0 20.16 20.16L24.5 24.5"/><circle class="logo-node" cx="24.5" cy="24.5" r="2.5"/></svg><span class="brand-name">QueryFlow</span></span>
        <div class="dialect-pick">
          <button class="dialect" aria-haspopup="menu" aria-expanded="false" title="SQL dialect: how the query is highlighted, checked and formatted"><span class="dialect-name">BigQuery</span></button>
          <div class="dialect-menu" role="menu" aria-label="SQL dialect" hidden></div>
        </div>
        <div class="history" role="group" aria-label="Undo and redo">
          <button class="icon-btn" data-act="undo" title="Undo (⌘Z): works for edits made in the editor or the side panels" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L2 7l3.5 3.5M2.5 7H10a4 4 0 010 8H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" data-act="redo" title="Redo (⌘⇧Z)" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5L14 7l-3.5 3.5M13.5 7H6a4 4 0 000 8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="spacer"></span>
        <button class="changes-btn" data-act="changes" hidden></button>
        <button class="icon-btn" data-act="share" title="Copy a share link: the query is inside the link, nothing is uploaded" aria-label="Copy share link">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.8 9.2a3 3 0 004.3 0l2.2-2.2a3 3 0 00-4.3-4.3l-.9.9M9.2 6.8a3 3 0 00-4.3 0L2.7 9a3 3 0 004.3 4.3l.9-.9" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="icon-btn" data-act="copy" title="Copy SQL (⌘⇧Enter)" aria-label="Copy SQL">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.2V3a1.5 1.5 0 00-1.5-1.5H4A1.5 1.5 0 002.5 3v6A1.5 1.5 0 004 10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="btn primary" data-act="format" title="Format (⌘⇧F or ⌘S)">Format</button>
        <div class="theme-pick">
          <button class="icon-btn theme-btn" data-act="theme" title="More: paste, open, save, preview, sample, clear, format on paste, theme" aria-haspopup="menu" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
          </button>
          <div class="theme-menu" role="menu" aria-label="More" hidden></div>
        </div>
      </div>
      <div id="editor" class="editor-wrap"></div>
      <div class="statusbar">
        <span id="stat-summary"></span>
        <span class="spacer"></span>
        <button id="stat-lint" class="lint-summary" title="Problems (⌘⇧M to list them all)" aria-haspopup="menu" aria-expanded="false"></button>
        <span id="stat-cursor"></span>
      </div>
    </section>
    <div class="gutter gutter-v" data-split="left" role="separator" aria-orientation="vertical"></div>
    <section class="right">
      <div id="vars" class="vars-panel"></div>
      <div class="gutter gutter-h" data-split="top" role="separator" aria-orientation="horizontal"></div>
      <div id="graph" class="graph-panel"></div>
    </section>
  </main>
  <!-- Phones: one view at a time, switched from this bar (src/main.js); hidden on wider screens. -->
  <nav class="m-nav" aria-label="Views">
    <button data-mview="sql"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 4.5L2 8l3.5 3.5M10.5 4.5L14 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Query</button>
    <button data-mview="values"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="10.5" cy="4.5" r="1.6" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/><circle cx="5.5" cy="8" r="1.6" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/><circle cx="9" cy="11.5" r="1.6" fill="var(--panel)" stroke="currentColor" stroke-width="1.4"/></svg>Values</button>
    <button data-mview="panel" data-tab="steps"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4h7.5M6 8h7.5M6 12h7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="3" cy="4" r="1.1" fill="currentColor"/><circle cx="3" cy="8" r="1.1" fill="currentColor"/><circle cx="3" cy="12" r="1.1" fill="currentColor"/></svg>Steps</button>
    <button data-mview="panel" data-tab="graph"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2" width="5" height="3.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="1.5" y="10.5" width="5" height="3.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="9.5" y="6.25" width="5" height="3.5" rx="1" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M6.5 3.75h1.5v8.5H6.5M8 8h1.5" fill="none" stroke="currentColor" stroke-width="1.3"/></svg>Graph</button>
    <button data-mview="panel" data-tab="run"><svg width="18" height="18" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.2v9.6L12.8 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>Run</button>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
