<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>QueryFlow</title>
  <meta name="description" content="A fast, private BigQuery SQL editor that runs in your browser: formatting, lint, join graph, step-by-step view and editable variables." />
  <link rel="icon" type="image/svg+xml" href="./logo.svg" />
  <script>
    // Set the theme before first paint. Keep in step with resolveTheme() in main.js.
    (function () {
      let p = null;
      try { p = localStorage.getItem('queryflow.theme'); } catch {}
      if (!['paper', 'linen', 'midnight', 'graphite'].includes(p)) p = matchMedia('(prefers-color-scheme: dark)').matches ? 'midnight' : 'paper';
      document.documentElement.dataset.theme = p;
    })();
  </script>
</head>
<body>
  <main class="layout">
    <section class="left">
      <div class="editor-bar actions">
        <span class="brand"><svg class="logo" width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="currentColor"/><path d="M7 24h6v-6h6v-6h6" fill="none" class="logo-ink" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span class="brand-name">QueryFlow</span><span class="dialect">BigQuery</span></span>
        <div class="history" role="group" aria-label="Undo and redo">
          <button class="icon-btn" data-act="undo" title="Undo (⌘Z): works for edits made in the editor or the side panels" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5L2 7l3.5 3.5M2.5 7H10a4 4 0 010 8H7" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button class="icon-btn" data-act="redo" title="Redo (⌘⇧Z)" disabled>
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><path d="M10.5 3.5L14 7l-3.5 3.5M13.5 7H6a4 4 0 000 8h3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
        <span class="spacer"></span>
        <button class="changes-btn" data-act="changes" hidden></button>
        <button class="icon-btn" data-act="copy" title="Copy SQL (⌘⇧Enter)" aria-label="Copy SQL">
          <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.2V3a1.5 1.5 0 00-1.5-1.5H4A1.5 1.5 0 002.5 3v6A1.5 1.5 0 004 10.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        </button>
        <button class="btn primary" data-act="format" title="Format (⌘⇧F or ⌘S)">Format</button>
        <div class="theme-pick">
          <button class="icon-btn theme-btn" data-act="theme" title="More: paste, sample, clear, format on paste, theme" aria-haspopup="menu" aria-expanded="false">
            <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="8" r="1.4" fill="currentColor"/><circle cx="8" cy="8" r="1.4" fill="currentColor"/><circle cx="13" cy="8" r="1.4" fill="currentColor"/></svg>
          </button>
          <div class="theme-menu" role="menu" aria-label="More" hidden></div>
        </div>
      </div>
      <div id="editor" class="editor-wrap"></div>
      <div class="statusbar">
        <span id="stat-summary"></span>
        <span class="spacer"></span>
        <button id="stat-lint" class="lint-summary" title="Problems (⌘⇧M to list them all)" aria-haspopup="menu" aria-expanded="false"></button>
        <span id="stat-cursor"></span>
      </div>
    </section>
    <div class="gutter gutter-v" data-split="left" role="separator" aria-orientation="vertical"></div>
    <section class="right">
      <div id="vars" class="vars-panel"></div>
      <div class="gutter gutter-h" data-split="top" role="separator" aria-orientation="horizontal"></div>
      <div id="graph" class="graph-panel"></div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
